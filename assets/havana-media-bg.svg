<g fill="none" stroke="#32DAD6" stroke-width="3" opacity=".40">
  <path d="M80 1130 C220 1106 358 1140 514 1114 C630 1095 716 1102 800 1086"/>
  <path d="M104 1196 C245 1171 381 1201 526 1180 C647 1162 731 1168 800 1152"/>
  <path d="M162 1275 C300 1250 431 1277 566 1258 C666 1244 739 1248 800 1236"/>
</g>
