<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1600" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#315262"/>
    <stop offset=".22" stop-color="#243940"/>
    <stop offset=".46" stop-color="#2B2520"/>
    <stop offset=".67" stop-color="#C77D31"/>
    <stop offset=".82" stop-color="#171A1B"/>
    <stop offset="1" stop-color="#090B0C"/>
  </linearGradient>
  <radialGradient id="sun" cx=".58" cy=".53" r=".48">
    <stop offset="0" stop-color="#FFCD76" stop-opacity=".68"/>
    <stop offset=".35" stop-color="#F0A545" stop-opacity=".25"/>
    <stop offset="1" stop-color="#F0A545" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#14292E"/>
    <stop offset=".58" stop-color="#123B42"/>
    <stop offset="1" stop-color="#081416"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#B9782C"/>
    <stop offset=".45" stop-color="#F2C76F"/>
    <stop offset=".75" stop-color="#FFF0B7"/>
    <stop offset="1" stop-color="#C98B35"/>
  </linearGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="18"/>
  </filter>
</defs>

<!-- atmospheric base -->
<rect width="800" height="1600" fill="url(#sky)"/>
<rect width="800" height="1600" fill="url(#sun)"/>
<ellipse cx="480" cy="870" rx="390" ry="280" fill="#E9973E" opacity=".13" filter="url(#soft)"/>
<ellipse cx="105" cy="440" rx="220" ry="300" fill="#24D7D1" opacity=".055" filter="url(#soft)"/>

<!-- stars -->
<g fill="#F7D98C" opacity=".65" filter="url(#glow)">
  <circle cx="110" cy="126" r="2"/><circle cx="640" cy="180" r="2.2"/><circle cx="705" cy="312" r="1.8"/>
  <circle cx="530" cy="98" r="1.4"/><circle cx="288" cy="214" r="1.5"/><circle cx="382" cy="142" r="1.2"/>
</g>

<!-- palm upper right -->
<g fill="none" stroke="url(#gold)" stroke-linecap="round" stroke-width="5" opacity=".58" filter="url(#glow)">
  <path d="M742 0 C704 94 684 183 679 292"/>
  <path d="M699 108 C630 49 567 39 506 58 C573 67 631 91 681 135"/>
  <path d="M699 112 C744 52 776 34 800 36"/>
  <path d="M690 128 C618 117 561 136 524 168 C591 153 644 157 684 177"/>
