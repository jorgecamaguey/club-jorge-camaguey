    <path d="M79 269 V365"/>
    <path d="M58 348 L80 328 L102 348 L97 425 L80 449 L63 425 Z"/>
    <path d="M65 359 H95 M62 383 H98 M66 423 H94"/>
    <circle cx="80" cy="387" r="12" fill="#F8C65F" stroke="none" opacity=".72"/>
  </g>
</g>

