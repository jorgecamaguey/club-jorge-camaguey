  <circle cx="640" cy="410" r="4"/><circle cx="596" cy="1014" r="3"/><circle cx="192" cy="728" r="3"/>
</g>

<!-- calm center veil for text readability -->
<rect x="110" y="210" width="580" height="610" rx="90" fill="#0C1215" opacity=".12"/>
</svg>