  <path d="M268 1096 C292 1112 314 1120 350 1112"/>
  <path d="M416 1104 C446 1118 474 1120 506 1111"/>
  <path d="M603 1083 C626 1095 651 1096 681 1087"/>
  <path d="M325 1168 C358 1180 387 1179 420 1169"/>
</g>

<!-- conga + maracas foreground -->
